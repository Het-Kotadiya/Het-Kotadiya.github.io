# Site settings. GitHub reads this file when it builds your site.
title: Het Kotadiya
author: Het Kotadiya
description: Master's student at DePaul University, working toward AI safety research.
url: https://hetkotadiya.com

# Article web addresses look like: hetkotadiya.com/writing/my-article-name/
permalink: /writing/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Free GitHub add-ons: an RSS feed (/feed.xml) and a sitemap for search engines
plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

# Files that should NOT appear on the website
exclude:
  - POST-TEMPLATE.md
  - README.md

# Every article uses the article design automatically
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
