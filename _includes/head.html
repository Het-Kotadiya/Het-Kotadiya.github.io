<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.title %}
<title>{{ page.title | escape }} — {{ site.title }}</title>
{%- else %}
<title>{{ site.title }} — AI Safety · Cybersecurity · OSINT</title>
{%- endif %}
{%- assign desc = page.summary | default: page.description | default: site.description %}
<meta name="description" content="{{ desc | strip_html | strip_newlines | escape }}">
<meta name="author" content="{{ site.author }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Security: only this site's own files and Google Fonts. No trackers, no outside scripts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<!-- Link previews (LinkedIn, Slack, etc.) -->
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ desc | strip_html | strip_newlines | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{%- if page.layout == "post" %}
<meta property="og:type" content="article">
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
{%- else %}
<meta property="og:type" content="website">
{%- endif %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }} — Writing" href="{{ '/feed.xml' | relative_url }}">

<!-- Theme switch + visual effects. Loads early so the page never flashes the wrong theme. -->
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
