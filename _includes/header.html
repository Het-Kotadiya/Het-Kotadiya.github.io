<header class="site-header" id="top">
 <div class="header-inner">
  <a href="{{ '/' | relative_url }}" class="brand" aria-label="Het Kotadiya — home">
    <span class="logo" aria-hidden="true">HK</span>
    <span class="brand-name">Het Kotadiya</span>
  </a>
  <nav aria-label="Main">
    <a href="{{ '/#work' | relative_url }}"><span class="u">Work</span></a>
    <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing/' %} aria-current="page"{% endif %}><span class="u">Writing</span></a>
    <a href="{{ '/#about' | relative_url }}"><span class="u">About</span></a>
    <a href="{{ '/#contact' | relative_url }}"><span class="u">Contact</span></a>
    <a href="{{ '/resume.pdf' | relative_url }}" class="btn" download>Resume <span class="arr dn">↓</span></a>
    <button type="button" id="theme-toggle" class="theme-btn" aria-label="Switch theme" hidden>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="8" height="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </button>
  </nav>
 </div>
</header>
